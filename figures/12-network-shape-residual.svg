<text x="16.0" y="290.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">两种连接的子层输入都是 4096 维。mHC 多出的是四路状态的保存，以及进出子层的混合（Sinkhorn 归一化的系数）。</text>
