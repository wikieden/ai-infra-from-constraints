<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="16.0" y="26.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#1f2937" text-anchor="start" font-weight="bold">例 5-6：最大值变大时，旧的 ℓ、u 一起乘 r = 1/2</text>
<text x="16.0" y="290.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">分数 [0, ln 2]，值 [1, 3]，每块一个元素。最后 u/ℓ = 3.5/1.5 = 7/3，与一次处理整行相同。</text>
<rect x="40.0" y="90.0" width="200.0" height="90.0" rx="8" fill="#e0ecff" stroke="#2563eb" stroke-width="1.4" opacity="1"/>
<text x="140.0" y="131.1" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">读块 1：s = 0, v = 1</text>
<text x="140.0" y="148.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#4b5563" text-anchor="middle" font-weight="normal">m = 0　ℓ = 1　u = 1</text>
<rect x="300.0" y="90.0" width="220.0" height="90.0" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4" opacity="1"/>
<text x="410.0" y="131.1" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">读块 2：s = ln 2, v = 3</text>
<text x="410.0" y="148.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#4b5563" text-anchor="middle" font-weight="normal">m = ln 2　r = 1/2</text>
<rect x="580.0" y="90.0" width="190.0" height="90.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4" opacity="1"/>
<text x="675.0" y="131.1" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">ℓ = 1/2 + 1 = 1.5</text>
<text x="675.0" y="148.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#4b5563" text-anchor="middle" font-weight="normal">u = 1/2 + 3 = 3.5</text>
<line x1="240.0" y1="135.0" x2="300.0" y2="135.0" stroke="#4b5563" stroke-width="1.6"/>
<polygon points="300.0,135.0 292.1,139.2 292.1,130.8" fill="#4b5563" stroke="#4b5563" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" opacity="1"/>
<rect x="235.4" y="118.5" width="69.2" height="16.5" rx="3" fill="#ffffff" stroke="none" stroke-width="1.4" opacity="0.9"/>
<text x="270.0" y="130.5" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#4b5563" text-anchor="middle" font-weight="normal">传 m、ℓ、u</text>
<line x1="520.0" y1="135.0" x2="580.0" y2="135.0" stroke="#4b5563" stroke-width="1.6"/>
<polygon points="580.0,135.0 572.1,139.2 572.1,130.8" fill="#4b5563" stroke="#4b5563" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" opacity="1"/>
<rect x="580.0" y="210.0" width="190.0" height="50.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4" opacity="1"/>
<text x="675.0" y="238.9" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">输出 u/ℓ = 7/3</text>
<line x1="675.0" y1="180.0" x2="675.0" y2="210.0" stroke="#7c3aed" stroke-width="1.6"/>
<polygon points="675.0,210.0 670.8,202.1 679.2,202.1" fill="#7c3aed" stroke="#7c3aed" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" opacity="1"/>
</svg>
