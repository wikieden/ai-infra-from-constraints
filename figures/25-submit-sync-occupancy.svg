<text x="710.0" y="90.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">满</text>
<text x="170.0" y="150.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#1f2937" text-anchor="end" font-weight="normal">共享内存 228 KB</text>
<rect x="180.0" y="130.0" width="520.0" height="30.0" rx="3" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.4" opacity="1"/>
