<text x="640.0" y="156.2" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#4b5563" text-anchor="middle" font-weight="normal">decode</text>
<line x1="398.0" y1="165.0" x2="560.0" y2="144.0" stroke="#2563eb" stroke-width="1.6"/>
<polygon points="560.0,144.0 552.7,149.2 551.6,140.8" fill="#2563eb" stroke="#2563eb" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" opacity="1"/>
<rect x="560.0" y="182.0" width="160.0" height="44.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4" opacity="1"/>
<text x="640.0" y="200.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#1f2937" text-anchor="middle" font-weight="bold">前向 3</text>
<text x="640.0" y="216.2" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#4b5563" text-anchor="middle" font-weight="normal">decode</text>
<line x1="398.0" y1="165.0" x2="560.0" y2="204.0" stroke="#2563eb" stroke-width="1.6"/>
<polygon points="560.0,204.0 551.3,206.2 553.3,198.0" fill="#2563eb" stroke="#2563eb" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" opacity="1"/>
<text x="640.0" y="254.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#6b7280" text-anchor="middle" font-weight="normal">⋮</text>
<rect x="560.0" y="266.0" width="160.0" height="44.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4" opacity="1"/>
