<text x="640.0" y="300.2" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#4b5563" text-anchor="middle" font-weight="normal">decode</text>
<line x1="398.0" y1="165.0" x2="560.0" y2="288.0" stroke="#2563eb" stroke-width="1.6"/>
<polygon points="560.0,288.0 551.1,286.6 556.2,279.8" fill="#2563eb" stroke="#2563eb" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" opacity="1"/>
<rect x="404.8" y="41.5" width="150.4" height="16.5" rx="3" fill="#ffffff" stroke="none" stroke-width="1.4" opacity="0.9"/>
<text x="480.0" y="53.5" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#2563eb" text-anchor="middle" font-weight="normal">每次都读一遍 ≈ 15.14 GB</text>
<text x="744.0" y="120.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13" fill="#2563eb" text-anchor="start" font-weight="bold">读取总量</text>
<text x="744.0" y="137.6" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13" fill="#2563eb" text-anchor="start" font-weight="bold">≈ N × 15.14 GB</text>
<text x="744.0" y="182.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13" fill="#6b7280" text-anchor="start" font-weight="bold">加载次数</text>
<text x="744.0" y="199.6" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13" fill="#6b7280" text-anchor="start" font-weight="bold">= 1</text>
