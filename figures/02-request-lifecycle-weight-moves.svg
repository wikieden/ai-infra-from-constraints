<text x="640.0" y="96.2" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#4b5563" text-anchor="middle" font-weight="normal">prefill</text>
<line x1="398.0" y1="165.0" x2="560.0" y2="84.0" stroke="#2563eb" stroke-width="1.6"/>
