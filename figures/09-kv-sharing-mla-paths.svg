<text x="16.0" y="320.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">结合律：q(cU_k)ᵀ = (qU_kᵀ)cᵀ。展开路径给每个上下文 token 升维；紧凑路径只变换当前这一个查询。</text>
<text x="220.0" y="66.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#1f2937" text-anchor="middle" font-weight="bold">展开路径</text>
