<text x="16.0" y="290.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">方框宽度按字节比例。GQA 两端各 1.125 GiB，传输中共 2.25 GiB；紧凑 MLA 两端各 549 MiB，共 1.07 GiB。</text>
<text x="140.0" y="88.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#1f2937" text-anchor="end" font-weight="bold">① 交接开始</text>
