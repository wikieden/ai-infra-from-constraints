<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="16.0" y="26.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#1f2937" text-anchor="start" font-weight="bold">最小帧条件下，光转发要多少个 CPU 核</text>
<text x="16.0" y="330.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">每包在线路上占 84 字节；单核每秒处理 1000 万（多的一端）到 2000 万（少的一端）个包，核数向上取整。</text>
<text x="248.0" y="84.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13" fill="#1f2937" text-anchor="end" font-weight="bold">10 Gbit/s</text>
<text x="248.0" y="102.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11" fill="#6b7280" text-anchor="end" font-weight="normal">14.9 百万包/秒</text>
<rect x="260.0" y="70.0" width="44.0" height="36.0" rx="4" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4" opacity="1"/>
<rect x="312.0" y="70.0" width="44.0" height="36.0" rx="4" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.4" opacity="1"/>
<text x="370.0" y="93.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#ea580c" text-anchor="start" font-weight="bold">1–2 个核</text>
<text x="248.0" y="146.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13" fill="#1f2937" text-anchor="end" font-weight="bold">25 Gbit/s</text>
<text x="248.0" y="164.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11" fill="#6b7280" text-anchor="end" font-weight="normal">37.2 百万包/秒</text>
<rect x="260.0" y="132.0" width="44.0" height="36.0" rx="4" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4" opacity="1"/>
<rect x="312.0" y="132.0" width="44.0" height="36.0" rx="4" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4" opacity="1"/>
<rect x="364.0" y="132.0" width="44.0" height="36.0" rx="4" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.4" opacity="1"/>
<rect x="416.0" y="132.0" width="44.0" height="36.0" rx="4" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.4" opacity="1"/>
<text x="474.0" y="155.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#ea580c" text-anchor="start" font-weight="bold">2–4 个核</text>
<text x="248.0" y="208.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13" fill="#1f2937" text-anchor="end" font-weight="bold">40 Gbit/s</text>
<text x="248.0" y="226.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11" fill="#6b7280" text-anchor="end" font-weight="normal">59.5 百万包/秒</text>
<rect x="260.0" y="194.0" width="44.0" height="36.0" rx="4" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4" opacity="1"/>
<rect x="312.0" y="194.0" width="44.0" height="36.0" rx="4" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4" opacity="1"/>
<rect x="364.0" y="194.0" width="44.0" height="36.0" rx="4" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4" opacity="1"/>
<rect x="416.0" y="194.0" width="44.0" height="36.0" rx="4" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.4" opacity="1"/>
<rect x="468.0" y="194.0" width="44.0" height="36.0" rx="4" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.4" opacity="1"/>
<rect x="520.0" y="194.0" width="44.0" height="36.0" rx="4" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.4" opacity="1"/>
<text x="578.0" y="217.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#ea580c" text-anchor="start" font-weight="bold">3–6 个核</text>
<line x1="260.0" y1="270.0" x2="282.0" y2="270.0" stroke="#ea580c" stroke-width="2.5"/>
<text x="288.0" y="274.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#1f2937" text-anchor="start" font-weight="normal">单核 2000 万包/秒也要的核</text>
<line x1="260.0" y1="288.0" x2="282.0" y2="288.0" stroke="#ca8a04" stroke-width="2.5"/>
<text x="288.0" y="292.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#1f2937" text-anchor="start" font-weight="normal">单核只有 1000 万包/秒时还要加的核</text>
</svg>
