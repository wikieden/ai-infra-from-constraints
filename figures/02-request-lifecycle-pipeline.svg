<svg xmlns="http://www.w3.org/2000/svg" width="880" height="250" viewBox="0 0 880 250">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="16.0" y="26.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#1f2937" text-anchor="start" font-weight="bold">实例内部：先在 CPU 这边整理好，最后才把一串算子交给 GPU</text>
<text x="16.0" y="240.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">编号对应讲义第二步的表。前 4 步不动 GPU，第 5 步才把一串算子交给 GPU 执行。</text>
<rect x="14.0" y="56.0" width="708.0" height="150.0" rx="10" fill="#e0ecff" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="5 4" opacity="0.55"/>
<text x="24.0" y="74.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="12" fill="#2563eb" text-anchor="start" font-weight="bold">CPU 这边（实例调度器、运行时）</text>
<rect x="736.0" y="56.0" width="130.0" height="150.0" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4" stroke-dasharray="5 4" opacity="0.55"/>
<text x="746.0" y="74.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="12" fill="#16a34a" text-anchor="start" font-weight="bold">GPU</text>
<rect x="28.0" y="96.0" width="120.0" height="74.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.4" opacity="1"/>
<text x="88.0" y="129.1" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">1 切 token</text>
<text x="88.0" y="146.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#4b5563" text-anchor="middle" font-weight="normal">文本 → 编号</text>
<rect x="166.0" y="96.0" width="120.0" height="74.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.4" opacity="1"/>
<text x="226.0" y="129.1" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">2 排队</text>
<text x="226.0" y="146.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#4b5563" text-anchor="middle" font-weight="normal">进请求队列</text>
<rect x="304.0" y="96.0" width="120.0" height="74.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.4" opacity="1"/>
<text x="364.0" y="129.1" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">3 编 batch</text>
<text x="364.0" y="146.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#4b5563" text-anchor="middle" font-weight="normal">和别的请求一起</text>
<rect x="442.0" y="96.0" width="120.0" height="74.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.4" opacity="1"/>
<text x="502.0" y="129.1" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">4 留状态空间</text>
<text x="502.0" y="146.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#4b5563" text-anchor="middle" font-weight="normal">给 KV 缓存分显存</text>
<rect x="580.0" y="96.0" width="120.0" height="74.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.4" opacity="1"/>
<text x="640.0" y="129.1" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">5 提交</text>
<text x="640.0" y="146.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#4b5563" text-anchor="middle" font-weight="normal">运行时发任务</text>
<rect x="748.0" y="96.0" width="106.0" height="74.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4" opacity="1"/>
<text x="801.0" y="129.1" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">执行算子</text>
<text x="801.0" y="146.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#4b5563" text-anchor="middle" font-weight="normal">矩阵乘法等</text>
<line x1="148.0" y1="133.0" x2="166.0" y2="133.0" stroke="#4b5563" stroke-width="1.6"/>
<polygon points="166.0,133.0 158.1,137.2 158.1,128.8" fill="#4b5563" stroke="#4b5563" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" opacity="1"/>
<line x1="286.0" y1="133.0" x2="304.0" y2="133.0" stroke="#4b5563" stroke-width="1.6"/>
<polygon points="304.0,133.0 296.1,137.2 296.1,128.8" fill="#4b5563" stroke="#4b5563" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" opacity="1"/>
<line x1="424.0" y1="133.0" x2="442.0" y2="133.0" stroke="#4b5563" stroke-width="1.6"/>
<polygon points="442.0,133.0 434.1,137.2 434.1,128.8" fill="#4b5563" stroke="#4b5563" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" opacity="1"/>
<line x1="562.0" y1="133.0" x2="580.0" y2="133.0" stroke="#4b5563" stroke-width="1.6"/>
<polygon points="580.0,133.0 572.1,137.2 572.1,128.8" fill="#4b5563" stroke="#4b5563" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" opacity="1"/>
<line x1="700.0" y1="133.0" x2="748.0" y2="133.0" stroke="#4b5563" stroke-width="1.6"/>
<polygon points="748.0,133.0 740.1,137.2 740.1,128.8" fill="#4b5563" stroke="#4b5563" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" opacity="1"/>
</svg>
