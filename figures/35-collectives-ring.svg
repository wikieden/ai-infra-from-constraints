<svg xmlns="http://www.w3.org/2000/svg" width="760" height="260" viewBox="0 0 760 260">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="16.0" y="26.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#1f2937" text-anchor="start" font-weight="bold">环形归约跟踪块 0：每经过一张卡就加入一份贡献</text>
<text x="16.0" y="250.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">四卡环 0→1→2→3。块 0 在四卡上的贡献是 1、10、100、1000；三轮后卡 3 持有完整和 1111，其余块同时沿环推进。</text>
<rect x="40.0" y="100.0" width="130.0" height="70.0" rx="8" fill="#e0ecff" stroke="#2563eb" stroke-width="1.4" opacity="1"/>
<text x="105.0" y="131.1" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">卡 0</text>
<text x="105.0" y="148.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#4b5563" text-anchor="middle" font-weight="normal">块 0 = 1</text>
<line x1="170.0" y1="135.0" x2="220.0" y2="135.0" stroke="#6b7280" stroke-width="1.6"/>
<polygon points="220.0,135.0 212.1,139.2 212.1,130.8" fill="#6b7280" stroke="#6b7280" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" opacity="1"/>
<rect x="169.5" y="118.5" width="51.0" height="16.5" rx="3" fill="#ffffff" stroke="none" stroke-width="1.4" opacity="0.9"/>
<text x="195.0" y="130.5" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal">第 1 轮</text>
<rect x="220.0" y="100.0" width="130.0" height="70.0" rx="8" fill="#e0ecff" stroke="#2563eb" stroke-width="1.4" opacity="1"/>
<text x="285.0" y="131.1" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">卡 1</text>
<text x="285.0" y="148.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#4b5563" text-anchor="middle" font-weight="normal">块 0 = 11</text>
<line x1="350.0" y1="135.0" x2="400.0" y2="135.0" stroke="#6b7280" stroke-width="1.6"/>
<polygon points="400.0,135.0 392.1,139.2 392.1,130.8" fill="#6b7280" stroke="#6b7280" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" opacity="1"/>
<rect x="349.5" y="118.5" width="51.0" height="16.5" rx="3" fill="#ffffff" stroke="none" stroke-width="1.4" opacity="0.9"/>
<text x="375.0" y="130.5" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal">第 2 轮</text>
<rect x="400.0" y="100.0" width="130.0" height="70.0" rx="8" fill="#e0ecff" stroke="#2563eb" stroke-width="1.4" opacity="1"/>
<text x="465.0" y="131.1" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">卡 2</text>
<text x="465.0" y="148.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#4b5563" text-anchor="middle" font-weight="normal">块 0 = 111</text>
<line x1="530.0" y1="135.0" x2="580.0" y2="135.0" stroke="#6b7280" stroke-width="1.6"/>
<polygon points="580.0,135.0 572.1,139.2 572.1,130.8" fill="#6b7280" stroke="#6b7280" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" opacity="1"/>
<rect x="529.5" y="118.5" width="51.0" height="16.5" rx="3" fill="#ffffff" stroke="none" stroke-width="1.4" opacity="0.9"/>
<text x="555.0" y="130.5" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal">第 3 轮</text>
<rect x="580.0" y="100.0" width="130.0" height="70.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4" opacity="1"/>
