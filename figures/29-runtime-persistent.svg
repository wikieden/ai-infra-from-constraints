<text x="16.0" y="290.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">8 块，每块投影 12.8 μs、激活 1.76 μs；按块时每任务另加 0.52 μs 领取与通知。两次 launch 约 126 μs → 一次 launch 约 114 μs。</text>
