<polygon points="470.0,220.0 462.1,224.2 462.1,215.8" fill="#4b5563" stroke="#4b5563" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" opacity="1"/>
<line x1="640.0" y1="220.0" x2="690.0" y2="220.0" stroke="#4b5563" stroke-width="1.6"/>
