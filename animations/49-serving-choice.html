<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>内存与时限下的方案选择</title><link rel="stylesheet" href="anim.css">
<style>svg text.cap{font-size:15px;font-weight:500}svg text.num{font-size:16px;font-weight:600}</style></head>
<body><main>
<h1>第 49 章 · 16 条长请求的四种方案</h1>
<p class="sub">配套讲义：<a href="../lessons/49-serving-choice.html">第 49 章 · 请求负载下的性能与配置选择：数正确且按时的答案</a>。A：BF16 独立；B：共享前缀；C：q8_0 独立；D：共享前缀 + 推测（每轮 3 个）。</p>
<div class="panel"><svg id="sv" viewBox="0 0 680 360"></svg></div>
<div class="row"><button id="play">▶ 播放</button><button id="step">→ 单步</button><button id="reset">↺ 从头开始</button></div>
<div class="row"><label for="m">KV 预留（GiB）</label><input type="range" id="m" min="4" max="24" step="0.5" value="12"><span id="mv">12</span><label for="d">时限（s）</label><input type="range" id="d" min="2" max="16" step="0.5" value="7"><span id="dv">7</span><label for="g">输出长度</label><select id="g"><option value="256">256</option><option value="16">16</option><option value="512">512</option></select></div>
<p class="note">看点：① 平面上四个点：横轴内存、纵轴总耗时；② 两条虚线是内存上限和时限，左下是可行区；③ 右边列出可行的方案；④ 播放 12 GiB / 7 s（只有 D）→ 6 GiB（无解）→ 输出 16（B、D 都行）→ 时限 10 s。</p>
</main>
<script src="anim.js"></script>
<script>
const sv=$('sv');
function R(x,y,w,h,col,op){return el('rect',{x,y,width:Math.max(w,1),height:h,rx:4,fill:col,opacity:op??.7},sv)}
function T(s,x,y,a,c){return txt(s,{x,y,'text-anchor':a||'start',class:c||'m'},sv)}
function cap(s){T(s,340,26,'middle','cap')}
const GET=ids=>ids.map(i=>{const e=$(i);return e.type==='checkbox'?+e.checked:+e.value});
function SET(ids,v){ids.forEach((i,k)=>{const e=$(i);if(e.type==='checkbox')e.checked=!!v[k];else e.value=v[k];const o=$(i+'v');if(o)o.textContent=(+v[k]).toString()})}
const IDS=['m','d','g'],F=[[12,7,256],[6,7,256],[12,7,16],[12,10,256]];
function render(m,d,g){const P={A:[18.56,7.34+(g-1)*0.02963],B:[5.91,2.04+(g-1)*0.02735],C:[9.86,7.34+(g-1)*0.02826],D:[9.02,2.23+Math.ceil((g-1)/3)*0.02735]};
 const X=v=>70+v/24*420,Y=v=>320-Math.min(v,20)/20*260,ok=Object.keys(P).filter(k=>P[k][0]<=m&&P[k][1]<=d);
 cap(`${m} GiB、${d} s、输出 ${g}：可行 ${ok.length?ok.join('、'):'无'}`);
 el('rect',{x:70,y:Y(d),width:X(m)-70,height:320-Y(d),fill:'var(--good)',opacity:.12},sv);
 el('line',{x1:X(m),y1:60,x2:X(m),y2:320,stroke:'var(--bad)','stroke-dasharray':'5 4'},sv);el('line',{x1:70,y1:Y(d),x2:490,y2:Y(d),stroke:'var(--bad)','stroke-dasharray':'5 4'},sv);
 el('line',{x1:70,y1:320,x2:490,y2:320,stroke:'var(--line)'},sv);el('line',{x1:70,y1:60,x2:70,y2:320,stroke:'var(--line)'},sv);
 Object.entries(P).forEach(([k,[mm,t]])=>{el('circle',{cx:X(mm),cy:Y(t),r:8,fill:ok.includes(k)?'var(--good)':'var(--warm)'},sv);T(`${k} ${t.toFixed(2)} s`,X(mm)+12,Y(t)+4)});
 T('内存（GiB）',280,345,'middle');Object.entries(P).forEach(([k,[mm,t]],i)=>T(`${k}：${mm} GiB，${t.toFixed(2)} s ${ok.includes(k)?'✓':''}`,510,90+i*30))}
let k=0,custom=null;
function draw(){clear(sv);const v=custom||F[k];SET(IDS,v);render(...v)}
function reset(){k=0;custom=null;draw()}
function next(){if(custom!==null){custom=null;draw();return true}if(k>=F.length-1)return false;k++;draw();return true}
IDS.forEach(i=>{const e=$(i);const f=()=>{ANIM.stop();custom=GET(IDS);draw()};e.oninput=f;e.onchange=f});
setupPlayer({captureSeed:1,reset,next},1500);
</script><a href="https://wikieden.github.io/ai-books/" style="position:fixed;right:12px;bottom:12px;z-index:99;padding:4px 10px;border-radius:14px;background:rgba(127,127,127,.18);color:inherit;font:13px/1.6 system-ui,sans-serif;text-decoration:none">← 全部讲义书</a>
</body></html>
