<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>专家分派与各组负载</title><link rel="stylesheet" href="anim.css">
<style>svg text.cap{font-size:15px;font-weight:500}svg text.num{font-size:16px;font-weight:600}</style></head>
<body><main>
<h1>第 34 章 · 专家放在哪，最忙的卡有多忙</h1>
<p class="sub">配套讲义：<a href="../lessons/34-combined-parallel.html">第 34 章 · 组合并行与模型规模：坐标、复用与最忙的那一组</a>。128 个专家分成四个 EP 组（每组 32 个），每个 token 选 8 个，每个专家 36 MiB。</p>
<div class="panel"><svg id="sv" viewBox="0 0 680 360"></svg></div>
<div class="row"><button id="play">▶ 播放</button><button id="step">→ 单步</button><button id="reset">↺ 从头开始</button></div>
<div class="row"><label for="md">分派</label><select id="md"><option value="0">均匀</option><option value="1">集中在组 0</option><option value="2">分散到四组</option><option value="3">随机</option></select><label for="m">token 数</label><input type="range" id="m" min="1" max="256" step="1" value="64"><span id="mv">64</span></div>
<p class="note">看点：① 上面 128 格是专家，被选中的点亮；② 左下是权重读取；③ 右下四根柱是各组任务数，最高的标红；④ 播放：均匀 → 集中 → 分散 → 随机 64 个 token。</p>
</main>
<script src="anim.js"></script>
<script>
const sv=$('sv');
function R(x,y,w,h,col,op){return el('rect',{x,y,width:Math.max(w,1),height:h,rx:4,fill:col,opacity:op??.7},sv)}
function T(s,x,y,a,c){return txt(s,{x,y,'text-anchor':a||'start',class:c||'m'},sv)}
function cap(s){T(s,340,26,'middle','cap')}
const GET=ids=>ids.map(i=>{const e=$(i);return e.type==='checkbox'?+e.checked:+e.value});
function SET(ids,v){ids.forEach((i,k)=>{const e=$(i);if(e.type==='checkbox')e.checked=!!v[k];else e.value=v[k];const o=$(i+'v');if(o)o.textContent=(+v[k]).toString()})}
const IDS=['md','m'],F=[[0,64],[1,64],[2,64],[3,64]];
function rng(s){return()=>{s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function render(md,m){const cnt=new Array(128).fill(0);const r=rng(7);
 if(md===0){for(let i=0;i<m*8;i++)cnt[i%128]++}else if(md===1){for(let e=0;e<8;e++)cnt[e]=m}else if(md===2){[0,1,32,33,64,65,96,97].forEach(e=>cnt[e]=m)}
 else{for(let t=0;t<m;t++){const s=new Set();while(s.size<8)s.add(Math.floor(r()*128));s.forEach(e=>cnt[e]++)}}
 const act=cnt.filter(x=>x).length,load=[0,1,2,3].map(g=>cnt.slice(g*32,g*32+32).reduce((a,b)=>a+b,0)),mx=Math.max(...load);
 cap(`${['均匀','集中在组 0','分散到四组','随机'][md]}，${m} 个 token：${act} 个专家被选中`);
 const gc=['var(--accent)','var(--good)','var(--warm)','var(--purple)'];
 for(let e=0;e<128;e++)R(30+(e%32)*19.5,50+Math.floor(e/32)*20,16,16,cnt[e]?gc[Math.floor(e/32)]:'var(--line)',cnt[e]?.85:.3);
 T('权重读取',60,170);T(`${(act*36).toLocaleString()} MiB`,60,200,'start','num');
 load.forEach((v,g)=>{const h=v/Math.max(mx,1)*120;R(330+g*80,300-h,50,h,v===mx&&mx>load.reduce((a,b)=>a+b,0)/4*1.01?'var(--bad)':gc[g]);T(String(v),355+g*80,295-h,'middle');T(`组${g}`,355+g*80,318,'middle')})}
let k=0,custom=null;
function draw(){clear(sv);const v=custom||F[k];SET(IDS,v);render(...v)}
function reset(){k=0;custom=null;draw()}
function next(){if(custom!==null){custom=null;draw();return true}if(k>=F.length-1)return false;k++;draw();return true}
IDS.forEach(i=>{const e=$(i);const f=()=>{ANIM.stop();custom=GET(IDS);draw()};e.oninput=f;e.onchange=f});
setupPlayer({captureSeed:1,reset,next},1500);
</script><a href="https://wikieden.github.io/ai-books/" style="position:fixed;right:12px;bottom:12px;z-index:99;padding:4px 10px;border-radius:14px;background:rgba(127,127,127,.18);color:inherit;font:13px/1.6 system-ui,sans-serif;text-decoration:none">← 全部讲义书</a>
</body></html>
