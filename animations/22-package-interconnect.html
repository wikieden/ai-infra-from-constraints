<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>固定开销与带宽</title><link rel="stylesheet" href="anim.css">
<style>svg text.cap{font-size:15px;font-weight:500}svg text.num{font-size:17px;font-weight:600}</style></head>
<body><main>
<h1>第 22 章 · 传多大的数据，才轮到带宽说话</h1>
<p class="sub">配套讲义：<a href="../lessons/22-package-interconnect.html">第 22 章 · 多芯片封装与互联：计算放在哪，数据走哪条路</a>。T = α + V/R。A100 每方向 300 GB/s，H100 每方向 450 GB/s；固定开销 α 默认 2 μs。</p>
<div class="panel"><svg id="sv" viewBox="0 0 680 360"></svg></div>
<div class="row"><button id="play">▶ 播放</button><button id="step">→ 单步</button><button id="reset">↺ 从头开始</button></div>
<div class="row"><label for="v">自己拖：数据量（对数）</label><input type="range" id="v" min="10" max="26" step="0.5" value="13"><span id="vv">8 KiB</span></div><div class="row"><label for="a">固定开销 α（μs）</label><input type="range" id="a" min="0.5" max="8" step="0.5" value="2"><span id="av">2</span></div>
<p class="note">看点：① 两根横条各分两段：灰 = 固定开销 α，蓝 = 传输 V/R；② 数据量小于转折点 αR 时灰段占大头，换快链路几乎没用；③ 播放时 8 KiB → 256 KiB → 2 MiB → 32 MiB；④ 把 α 调小，小数据的时间跟着减。</p>
</main>
<script src="anim.js"></script>
<script>
const sv=$('sv');
const F=[[13,2],[18,2],[21,2],[25,2]];let k=0,custom=null;
const fmt=b=>b>=2**20?(b/2**20).toFixed(b>=2**24?0:1)+' MiB':(b/1024).toFixed(0)+' KiB';
function draw(){clear(sv);const [lv,a]=custom||F[k];const V=2**lv;$('v').value=lv;$('vv').textContent=fmt(V);$('a').value=a;$('av').textContent=a;
 const rows=[['A100',300e9],['H100',450e9]].map(([n,R])=>[n,R,a,V/R*1e6]);const tmax=Math.max(...rows.map(r=>r[2]+r[3]));
 txt(`V = ${fmt(V)}，α = ${a} μs：H100 比 A100 快 ${((1-(rows[1][2]+rows[1][3])/(rows[0][2]+rows[0][3]))*100).toFixed(0)}%`,{x:340,y:30,'text-anchor':'middle',class:'cap'},sv);
 rows.forEach(([n,R,al,tr],i)=>{const y=80+i*80,W=t=>t/tmax*460;txt(n,{x:100,y:y+28,'text-anchor':'end',class:'cap'},sv);
  el('rect',{x:110,y,width:W(al),height:44,fill:'var(--muted)',opacity:.45},sv);el('rect',{x:110+W(al),y,width:Math.max(W(tr),1),height:44,fill:'var(--accent)',opacity:.75},sv);
  txt(`${(al+tr).toFixed(2)} μs`,{x:118+W(al+tr),y:y+28,class:'num'},sv)});
 const vs=a*1e-6*450e9;txt(`H100 转折点 αR = ${fmt(vs)}：${V<vs?'现在在左边，固定开销主导 → 合并、减少轮数':'现在在右边，带宽主导 → 减字节、提带宽'}`,{x:340,y:270,'text-anchor':'middle',class:'m'},sv);
 const X=l=>60+(l-10)/16*560;el('line',{x1:60,y1:310,x2:620,y2:310,stroke:'var(--line)'},sv);
 el('line',{x1:X(Math.log2(vs)),y1:296,x2:X(Math.log2(vs)),y2:324,stroke:'var(--warm)','stroke-width':2},sv);el('circle',{cx:X(lv),cy:310,r:7,fill:'var(--accent)'},sv);
 txt('1 KiB',{x:60,y:340,'text-anchor':'middle',class:'m'},sv);txt('64 MiB',{x:620,y:340,'text-anchor':'middle',class:'m'},sv)}
function reset(){k=0;custom=null;draw()}
function next(){if(custom!==null){custom=null;draw();return true}if(k>=F.length-1)return false;k++;draw();return true}
const f=()=>{ANIM.stop();custom=[+$('v').value,+$('a').value];draw()};$('v').oninput=f;$('a').oninput=f;
setupPlayer({captureSeed:1,reset,next},1500);
</script><a href="https://wikieden.github.io/ai-books/" style="position:fixed;right:12px;bottom:12px;z-index:99;padding:4px 10px;border-radius:14px;background:rgba(127,127,127,.18);color:inherit;font:13px/1.6 system-ui,sans-serif;text-decoration:none">← 全部讲义书</a>
</body></html>
