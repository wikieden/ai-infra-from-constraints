<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PD 配比与请求率</title><link rel="stylesheet" href="anim.css">
<style>svg text.cap{font-size:15px;font-weight:500}svg text.num{font-size:16px;font-weight:600}</style></head>
<body><main>
<h1>第 51 章 · 拖动配比，看谁是瓶颈</h1>
<p class="sub">配套讲义：<a href="../lessons/51-pd-split.html">第 51 章 · Prefill–Decode 分离与资源配比：A100 做输入，H20 做生成</a>。四张 A100、四张 H20；每请求 P / D GPU 秒取例 9.2；状态 GQA 1.125 GiB 或 MLA 549 MiB。</p>
<div class="panel"><svg id="sv" viewBox="0 0 680 360"></svg></div>
<div class="row"><button id="play">▶ 播放</button><button id="step">→ 单步</button><button id="reset">↺ 从头开始</button></div>
<div class="row"><label for="a">P 用 A100</label><input type="range" id="a" min="0" max="4" step="1" value="4"><span id="av">4</span><label for="h">P 用 H20</label><input type="range" id="h" min="0" max="4" step="1" value="0"><span id="hv">0</span><label for="b">链路 GB/s</label><input type="range" id="b" min="1" max="50" step="1" value="25"><span id="bv">25</span><label for="s">状态</label><select id="s"><option value="1.208">GQA 1.125 GiB</option><option value="0.5757">MLA 549 MiB</option></select></div>
<p class="note">看点：① 八个方块：蓝做 P、绿做 D；② 三根横条：P 池、D 池、链路能力，最短的标红；③ 播放：最优 4.55 → 角色对调 → 一张 A100 调到 D → 链路 4 GB/s → 换 MLA。</p>
</main>
<script src="anim.js"></script>
<script>
const sv=$('sv');
function R(x,y,w,h,col,op){return el('rect',{x,y,width:Math.max(w,1),height:h,rx:4,fill:col,opacity:op??.7},sv)}
function T(s,x,y,a,c){return txt(s,{x,y,'text-anchor':a||'start',class:c||'m'},sv)}
function cap(s){T(s,340,26,'middle','cap')}
const GET=ids=>ids.map(i=>{const e=$(i);return e.type==='checkbox'?+e.checked:+e.value});
function SET(ids,v){ids.forEach((i,k)=>{const e=$(i);if(e.type==='checkbox')e.checked=!!v[k];else e.value=v[k];const o=$(i+'v');if(o)o.textContent=(+v[k]).toString()})}
const IDS=['a','h','b','s'],F=[[4,0,25,1.2080],[0,4,25,1.2080],[3,0,25,1.2080],[4,0,4,1.2080],[4,0,4,0.5757]];
function render(a,h,b,s){const mp=a/0.8564+h/1.8054,md=(4-a)/1.7634+(4-h)/0.8782,ml=b/s,mu=Math.min(mp,md,ml);
 cap(`P：${a} A100 + ${h} H20　→　上限 ${mu.toFixed(2)} 请求/s`);
 for(let i=0;i<8;i++){const A=i<4,isP=A?i<a:i-4<h;R(40+i*44,60,38,40,isP?'var(--accent)':'var(--good)');T(A?'A100':'H20',59+i*44,84,'middle');T(isP?'P':'D',59+i*44,118,'middle')}
 const sc=v=>Math.min(v,12)/12*420;[['P 池',mp],['D 池',md],['链路',ml]].forEach(([n,v],k)=>{const y=160+k*50;T(n,90,y+20,'end');R(100,y,sc(v),30,v===mu?'var(--bad)':'var(--muted)');T(v>12?`${v.toFixed(1)}（>12）`:v.toFixed(2),108+sc(v),y+20)})}
let k=0,custom=null;
function draw(){clear(sv);const v=custom||F[k];SET(IDS,v);render(...v)}
function reset(){k=0;custom=null;draw()}
function next(){if(custom!==null){custom=null;draw();return true}if(k>=F.length-1)return false;k++;draw();return true}
IDS.forEach(i=>{const e=$(i);const f=()=>{ANIM.stop();custom=GET(IDS);draw()};e.oninput=f;e.onchange=f});
setupPlayer({captureSeed:1,reset,next},1500);
</script><a href="https://wikieden.github.io/ai-books/" style="position:fixed;right:12px;bottom:12px;z-index:99;padding:4px 10px;border-radius:14px;background:rgba(127,127,127,.18);color:inherit;font:13px/1.6 system-ui,sans-serif;text-decoration:none">← 全部讲义书</a>
</body></html>
