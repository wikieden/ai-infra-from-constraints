<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>缓冲槽与流水</title><link rel="stylesheet" href="anim.css">
<style>svg text.cap{font-size:15px;font-weight:500}svg text.num{font-size:17px;font-weight:600}</style></head>
<body><main>
<h1>第 21 章 · 缓冲槽：几个盆才能让灶台不停</h1>
<p class="sub">配套讲义：<a href="../lessons/21-memory-movement.html">第 21 章 · 存储层次与数据搬移：放得下、取得到、来得及</a>。B200 单个 SM，4 块输入：传输 64、等待 128 tick 后就绪，计算 128 tick（矩阵 ×2 时 64）。传输串行，算完才释放槽。</p>
<div class="panel"><svg id="sv" viewBox="0 0 680 360"></svg></div>
<div class="row"><button id="play">▶ 播放</button><button id="step">→ 单步</button><button id="reset">↺ 从头开始</button></div>
<div class="row"><label for="n">自己拖：输入槽数</label><input type="range" id="n" min="1" max="4" step="1" value="1"><span id="nv">1</span><label><input type="checkbox" id="x2"> 矩阵速率 ×2</label></div>
<p class="note">看点：① 每行一块：青 = 传输，灰 = 等待，橙 = 计算，虚框 = 槽被占用；② 槽数少时下一块要等上一块算完才能开始传；③ 播放时槽数 1 → 2 → 3 → 4：1280 → 768 → 704 → 704；④ 矩阵 ×2 后三槽 512，四槽才到 448。</p>
</main>
<script src="anim.js"></script>
<script>
const sv=$('sv');
const F=[[1,0],[2,0],[3,0],[4,0],[3,1],[4,1]];let k=0,custom=null;
function sim(slots,tc){const free=Array(slots).fill(0);let iss=0,ce=0;const B=[];for(let i=0;i<4;i++){let s=0;for(let j=1;j<slots;j++)if(free[j]<free[s])s=j;const is=Math.max(free[s],iss);iss=is+64;const st=Math.max(is+192,ce);ce=st+tc;free[s]=ce;B.push({is,st,ce,s})}return B}
function draw(){clear(sv);const [n,x2]=custom||F[k];$('n').value=n;$('nv').textContent=n;$('x2').checked=!!x2;const tc=x2?64:128;const B=sim(n,tc);const end=B[3].ce;
 txt(`${n} 个槽${x2?'、矩阵 ×2':''}：完成于 ${end} tick（最早 ${192+4*tc}）`,{x:340,y:26,'text-anchor':'middle',class:'cap'},sv);
 const X=t=>90+t/1300*570;
 B.forEach((b,i)=>{const y=60+i*56;txt(`块 ${i+1} · 槽 ${b.s+1}`,{x:84,y:y+24,'text-anchor':'end',class:'m'},sv);
  el('rect',{x:X(b.is),y:y-4,width:X(b.ce)-X(b.is),height:40,fill:'none',stroke:'var(--muted)','stroke-dasharray':'4 3'},sv);
  el('rect',{x:X(b.is),y,width:X(64)-X(0),height:32,fill:'var(--teal)',opacity:.75},sv);
  el('rect',{x:X(b.is+64),y,width:X(128)-X(0),height:32,fill:'var(--line)',opacity:.6},sv);
  if(b.st>b.is+192)el('rect',{x:X(b.is+192),y,width:X(b.st)-X(b.is+192),height:32,fill:'var(--line)',opacity:.3},sv);
  el('rect',{x:X(b.st),y,width:X(tc)-X(0),height:32,fill:'var(--warm)',opacity:.8},sv)});
 el('line',{x1:X(0),y1:290,x2:X(1300),y2:290,stroke:'var(--line)'},sv);[0,256,512,768,1024,1280].forEach(t=>txt(String(t),{x:X(t),y:306,'text-anchor':'middle',class:'m'},sv));
 el('line',{x1:X(end),y1:50,x2:X(end),y2:290,stroke:'var(--bad)','stroke-dasharray':'5 4'},sv)}
function reset(){k=0;custom=null;draw()}
function next(){if(custom!==null){custom=null;draw();return true}if(k>=F.length-1)return false;k++;draw();return true}
const f=()=>{ANIM.stop();custom=[+$('n').value,+$('x2').checked];draw()};$('n').oninput=f;$('x2').onchange=f;
setupPlayer({captureSeed:1,reset,next},1500);
</script><a href="https://wikieden.github.io/ai-books/" style="position:fixed;right:12px;bottom:12px;z-index:99;padding:4px 10px;border-radius:14px;background:rgba(127,127,127,.18);color:inherit;font:13px/1.6 system-ui,sans-serif;text-decoration:none">← 全部讲义书</a>
</body></html>
