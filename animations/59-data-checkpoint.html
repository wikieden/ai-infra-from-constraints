<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>保存间隔与附加成本</title><link rel="stylesheet" href="anim.css">
<style>svg text.cap{font-size:15px;font-weight:500}svg text.num{font-size:16px;font-weight:600}</style></head>
<body><main>
<h1>第 59 章 · checkpoint 多久存一次</h1>
<p class="sub">配套讲义：<a href="../lessons/59-data-checkpoint.html">第 59 章 · 数据输入、checkpoint 与故障恢复：几周的作业怎么扛住中断</a>。L(τ) = c/τ + λτ/2 + λr；每卡平均约 337 天故障一次，任一卡故障都中断作业。</p>
<div class="panel"><svg id="sv" viewBox="0 0 680 360"></svg></div>
<div class="row"><button id="play">▶ 播放</button><button id="step">→ 单步</button><button id="reset">↺ 从头开始</button></div>
<div class="row"><label for="n">卡数</label><input type="range" id="n" min="8" max="4096" step="8" value="1024"><span id="nv">1024</span><label for="c">保存耗时 s</label><input type="range" id="c" min="2" max="60" step="0.5" value="16.4"><span id="cv">16.4</span><label for="r">恢复耗时 s</label><input type="range" id="r" min="0" max="600" step="10" value="120"><span id="rv">120</span><label for="t">保存间隔 s</label><input type="range" id="t" min="60" max="7200" step="60" value="900"><span id="tv">900</span></div>
<p class="note">看点：① 三条曲线：保存（蓝）、重做（橙）、合计（绿）；② 竖线是当前间隔，圆点是最优 τ*；③ 播放：1024 卡 900 s → 300 s → 48 卡 1800 s → 4096 卡。</p>
</main>
<script src="anim.js"></script>
<script>
const sv=$('sv');
function R(x,y,w,h,col,op){return el('rect',{x,y,width:Math.max(w,1),height:h,rx:4,fill:col,opacity:op??.7},sv)}
function T(s,x,y,a,c){return txt(s,{x,y,'text-anchor':a||'start',class:c||'m'},sv)}
function cap(s){T(s,340,26,'middle','cap')}
const GET=ids=>ids.map(i=>{const e=$(i);return e.type==='checkbox'?+e.checked:+e.value});
function SET(ids,v){ids.forEach((i,k)=>{const e=$(i);if(e.type==='checkbox')e.checked=!!v[k];else e.value=v[k];const o=$(i+'v');if(o)o.textContent=(+v[k]).toString()})}
const IDS=['n','c','r','t'],F=[[1024,16.4,120,900],[1024,16.4,120,300],[48,16.4,120,1800],[4096,16.4,120,900]];
function render(n,c,r,t){const lam=n/(1024*7.9*3600),L=x=>c/x+lam*x/2+lam*r,ts=Math.sqrt(2*c/lam),X=v=>70+Math.min(v,7200)/7200*540,Y=v=>300-Math.min(v,0.15)/0.15*240;
 cap(`τ = ${t} s：保存 ${(c/t*100).toFixed(1)}% + 重做 ${(lam*t/2*100).toFixed(1)}% + 恢复 ${(lam*r*100).toFixed(1)}% = ${(L(t)*100).toFixed(2)}%`);
 el('line',{x1:70,y1:300,x2:610,y2:300,stroke:'var(--line)'},sv);el('line',{x1:70,y1:60,x2:70,y2:300,stroke:'var(--line)'},sv);
 const pts=f=>{let s='';for(let x=60;x<=7200;x+=60)s+=`${X(x)},${Y(f(x))} `;return s};
 [[x=>c/x,'var(--accent)'],[x=>lam*x/2,'var(--warm)'],[L,'var(--good)']].forEach(([f,col])=>el('polyline',{points:pts(f),fill:'none',stroke:col,'stroke-width':2.5},sv));
 el('line',{x1:X(t),y1:60,x2:X(t),y2:300,stroke:'var(--text)','stroke-dasharray':'5 4'},sv);if(ts<=7200)el('circle',{cx:X(ts),cy:Y(L(ts)),r:6,fill:'var(--good)'},sv);
 T(`τ* = ${ts.toFixed(0)} s`,600,90,'end','num');[0,1800,3600,5400,7200].forEach(v=>T(String(v),X(v),318,'middle'));T('15%',64,64,'end')}
let k=0,custom=null;
function draw(){clear(sv);const v=custom||F[k];SET(IDS,v);render(...v)}
function reset(){k=0;custom=null;draw()}
function next(){if(custom!==null){custom=null;draw();return true}if(k>=F.length-1)return false;k++;draw();return true}
IDS.forEach(i=>{const e=$(i);const f=()=>{ANIM.stop();custom=GET(IDS);draw()};e.oninput=f;e.onchange=f});
setupPlayer({captureSeed:1,reset,next},1500);
</script><a href="https://wikieden.github.io/ai-books/" style="position:fixed;right:12px;bottom:12px;z-index:99;padding:4px 10px;border-radius:14px;background:rgba(127,127,127,.18);color:inherit;font:13px/1.6 system-ui,sans-serif;text-decoration:none">← 全部讲义书</a>
</body></html>
