<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>逐步生成：存的只多一格，读的越来越多</title><link rel="stylesheet" href="anim.css">
<style>svg text.big{font-size:15px}svg text.cap{font-size:15px;font-weight:500}svg text.num{font-size:22px;font-weight:600}</style></head>
<body><main>
<h1>第 08 章 · 逐步生成：存的只多一格，读的越来越多</h1>
<p class="sub">配套讲义：<a href="../lessons/08-generation-budget.html">第 08 章 · 自回归生成的资源账：存一次的、每步读的、用完就扔的</a>。每行是一次 decode：蓝色是要读的已有位置，橙色是这一步追加的位置。单位是"份"（一个 token 的 KV）。</p>
<div class="panel"><svg id="sv" viewBox="0 0 680 420"></svg></div>
<div class="row"><button id="play">▶ 播放</button><button id="step">→ 单步</button><button id="reset">↺ 从头开始</button></div>
<div class="row"><label for="h">自己拖：初始上下文 H</label><input type="range" id="h" min="1" max="12" step="1" value="6"><span id="hv">6</span></div>
<div class="row"><label for="n">decode 步数 n_d</label><input type="range" id="n" min="0" max="12" step="1" value="10"><span id="nv">10</span></div>
<p class="note">看点：① 第 j 次 decode 读 H + j 份，再追加 1 份；② "保存"每步只加 1，"累计读取"每步加一整行；③ 累计读取 = n_d·H + n_d(n_d-1)/2，保存 = H + n_d；④ H 或 n_d 越大，两者的比值越大（例题 2-3 里接近一千倍）。</p>
</main>
<script src="anim.js"></script>
<script>
const sv=$('sv');const H0=4,N0=8;
let k=0,custom=null;
function draw(){
  clear(sv);const H=custom?custom.H:H0,nd=custom?custom.n:k;
  const reads=nd*H+nd*(nd-1)/2,saved=H+nd;
  txt(custom?`H = ${H}，n_d = ${nd}`:(k===0?`prefill 后：上下文 ${H0} 份`:`第 ${k} 次 decode：读 ${H0+k-1} 份，追加 1 份`),{x:340,y:28,'text-anchor':'middle',class:'cap'},sv);
  const rows=Math.max(nd,1),c=Math.min(22,330/(H+Math.max(nd,1))),rh=Math.min(26,300/rows),x0=30,y0=56;
  if(nd===0){for(let i=0;i<H;i++)el('rect',{x:x0+i*c,y:y0,width:c-3,height:rh-4,rx:3,fill:'var(--teal)',opacity:.7},sv)}
  for(let j=0;j<nd;j++){for(let i=0;i<H+j+1;i++){const nw=i===H+j;
    el('rect',{x:x0+i*c,y:y0+j*rh,width:c-3,height:rh-4,rx:3,fill:nw?'var(--warm)':'var(--accent)',opacity:nw?.9:.6},sv)}}
  [['保存的 KV（份）',String(saved)],['累计读取（份）',String(reads)],['读取 ÷ 保存',saved?(reads/saved).toFixed(1)+' 倍':'—']].forEach(([a,b],i)=>{
    const y=60+i*90;el('rect',{x:440,y,width:220,height:74,rx:8,fill:'none',stroke:'var(--line)'},sv);txt(a,{x:452,y:y+24,class:'m'},sv);txt(b,{x:452,y:y+58,class:'num'},sv)});
}
function reset(){k=0;custom=null;draw()}
function next(){if(custom!==null){custom=null;k=0;draw();return true}if(k>=N0)return false;k++;draw();return true}
function fs(){ANIM.stop();custom={H:+$('h').value,n:+$('n').value};$('hv').textContent=custom.H;$('nv').textContent=custom.n;draw()}
$('h').oninput=fs;$('n').oninput=fs;
setupPlayer({captureSeed:1,reset,next},1100);
</script><a href="https://wikieden.github.io/ai-books/" style="position:fixed;right:12px;bottom:12px;z-index:99;padding:4px 10px;border-radius:14px;background:rgba(127,127,127,.18);color:inherit;font:13px/1.6 system-ui,sans-serif;text-decoration:none">← 全部讲义书</a>
</body></html>
