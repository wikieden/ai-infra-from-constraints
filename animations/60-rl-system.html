<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>同步与异步 RL 周期</title><link rel="stylesheet" href="anim.css">
<style>svg text.cap{font-size:15px;font-weight:500}svg text.num{font-size:16px;font-weight:600}</style></head>
<body><main>
<h1>第 60 章 · 异步训练，丢多少样本就不划算</h1>
<p class="sub">配套讲义：<a href="../lessons/60-rl-system.html">第 60 章 · 强化学习训练系统：生成、验证、学习组成的反馈循环</a>。同步：生成 → 学习 → 同步权重；异步：生成下一批与学习上一批并行，再同步。保留比例 q 是没因版本过旧被丢掉的样本占比。</p>
<div class="panel"><svg id="sv" viewBox="0 0 680 360"></svg></div>
<div class="row"><button id="play">▶ 播放</button><button id="step">→ 单步</button><button id="reset">↺ 从头开始</button></div>
<div class="row"><label for="g">生成 s</label><input type="range" id="g" min="10" max="80" step="1" value="40"><span id="gv">40</span><label for="l">学习 s</label><input type="range" id="l" min="5" max="60" step="1" value="16"><span id="lv">16</span><label for="s">同步 s</label><input type="range" id="s" min="0" max="20" step="1" value="4"><span id="sv">4</span><label for="q">保留比例</label><input type="range" id="q" min="0.5" max="1" step="0.01" value="0.8"><span id="qv">0.8</span></div>
<p class="note">看点：① 上面一行同步周期，下面两行异步稳态；② 右边是有效吞吐之比和门槛；③ 播放：40/16/4、q 0.8（快 9%）→ q 0.7（慢 5%）→ 学习 40 s → 同步 0。</p>
</main>
<script src="anim.js"></script>
<script>
const sv=$('sv');
function R(x,y,w,h,col,op){return el('rect',{x,y,width:Math.max(w,1),height:h,rx:4,fill:col,opacity:op??.7},sv)}
function T(s,x,y,a,c){return txt(s,{x,y,'text-anchor':a||'start',class:c||'m'},sv)}
function cap(s){T(s,340,26,'middle','cap')}
const GET=ids=>ids.map(i=>{const e=$(i);return e.type==='checkbox'?+e.checked:+e.value});
function SET(ids,v){ids.forEach((i,k)=>{const e=$(i);if(e.type==='checkbox')e.checked=!!v[k];else e.value=v[k];const o=$(i+'v');if(o)o.textContent=(+v[k]).toString()})}
const IDS=['g','l','s','q'],F=[[40,16,4,0.8],[40,16,4,0.7],[40,40,4,0.8],[40,16,0,0.8]];
function render(g,l,s,q){const ts=+g+ +l+ +s,ta=Math.max(g,l)+ +s,gain=q*ts/ta,th=ta/ts;
 cap(`同步 ${ts} s、异步 ${ta} s：异步 / 同步 = ${gain.toFixed(2)}，门槛 q > ${(th*100).toFixed(1)}%`);const sc=v=>v/140*480;
 T('同步',90,92,'end');R(100,70,sc(g),34,'var(--accent)');R(100+sc(g),70,sc(l),34,'var(--good)');R(100+sc(+g+ +l),70,sc(s),34,'var(--warm)');T(`${ts} s`,108+sc(ts),92);
 T('异步 · 生成',90,162,'end');R(100,140,sc(g),34,'var(--accent)');R(100+sc(Math.max(g,l)),140,sc(s),34,'var(--warm)');
 T('异步 · 学习',90,212,'end');R(100,190,sc(l),34,'var(--good)');R(100+sc(Math.max(g,l)),190,sc(s),34,'var(--warm)');T(`${ta} s`,108+sc(ta),212);
 T(gain>1?`异步快 ${((gain-1)*100).toFixed(0)}%`:`异步慢 ${((1-gain)*100).toFixed(0)}%`,340,280,'middle','num')}
let k=0,custom=null;
function draw(){clear(sv);const v=custom||F[k];SET(IDS,v);render(...v)}
function reset(){k=0;custom=null;draw()}
function next(){if(custom!==null){custom=null;draw();return true}if(k>=F.length-1)return false;k++;draw();return true}
IDS.forEach(i=>{const e=$(i);const f=()=>{ANIM.stop();custom=GET(IDS);draw()};e.oninput=f;e.onchange=f});
setupPlayer({captureSeed:1,reset,next},1500);
</script><a href="https://wikieden.github.io/ai-books/" style="position:fixed;right:12px;bottom:12px;z-index:99;padding:4px 10px;border-radius:14px;background:rgba(127,127,127,.18);color:inherit;font:13px/1.6 system-ui,sans-serif;text-decoration:none">← 全部讲义书</a>
</body></html>
