<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>会话迁移的回本</title><link rel="stylesheet" href="anim.css">
<style>svg text.cap{font-size:15px;font-weight:500}svg text.num{font-size:16px;font-weight:600}</style></head>
<body><main>
<h1>第 66 章 · 迁移还是不迁移</h1>
<p class="sub">配套讲义：<a href="../lessons/66-cross-device.html">第 66 章 · 跨设备分工与会话迁移：传图片、传特征，还是传状态</a>。G(N) = NΔt − M，M = 状态 × 8 / 链路 + 恢复时间。</p>
<div class="panel"><svg id="sv" viewBox="0 0 680 360"></svg></div>
<div class="row"><button id="play">▶ 播放</button><button id="step">→ 单步</button><button id="reset">↺ 从头开始</button></div>
<div class="row"><label for="s">状态 MiB</label><input type="range" id="s" min="8" max="256" step="8" value="64"><span id="sv">64</span><label for="b">链路 Mbit/s</label><input type="range" id="b" min="10" max="400" step="10" value="80"><span id="bv">80</span><label for="r">恢复 s</label><input type="range" id="r" min="0" max="5" step="0.5" value="1"><span id="rv">1</span><label for="d">每轮节省 s</label><input type="range" id="d" min="0.1" max="1" step="0.1" value="0.4"><span id="dv">0.4</span><label for="n">剩余轮数</label><input type="range" id="n" min="0" max="60" step="1" value="10"><span id="nv">10</span></div>
<p class="note">看点：① 斜线是 G(N)，零线以上划算；② 竖线是当前剩余轮数，右上角是 M 和回本轮数；③ 播放：剩 10 轮 → 20 轮 → 40 轮 → 恢复多 1 s → 链路 400 Mbit/s。</p>
</main>
<script src="anim.js"></script>
<script>
const sv=$('sv');
function R(x,y,w,h,col,op){return el('rect',{x,y,width:Math.max(w,1),height:h,rx:4,fill:col,opacity:op??.7},sv)}
function T(s,x,y,a,c){return txt(s,{x,y,'text-anchor':a||'start',class:c||'m'},sv)}
function cap(s){T(s,340,26,'middle','cap')}
const GET=ids=>ids.map(i=>{const e=$(i);return e.type==='checkbox'?+e.checked:+e.value});
function SET(ids,v){ids.forEach((i,k)=>{const e=$(i);if(e.type==='checkbox')e.checked=!!v[k];else e.value=v[k];const o=$(i+'v');if(o)o.textContent=(+v[k]).toString()})}
const IDS=['s','b','r','d','n'],F=[[64,80,1,0.4,10],[64,80,1,0.4,20],[64,80,1,0.4,40],[64,80,2,0.4,40],[64,400,1,0.4,10]];
function render(s,b,r,d,n){const M=s*1.048576*8/b+ +r,G=n*d-M,be=Math.floor(M/d)+1;
 cap(`M = ${M.toFixed(1)} s，剩 ${n} 轮净 ${G>=0?'+':''}${G.toFixed(1)} s，回本 ${be} 轮`);const X=v=>70+v/60*540,Y=v=>180-v*8;
 el('line',{x1:70,y1:Y(0),x2:610,y2:Y(0),stroke:'var(--line)'},sv);el('line',{x1:X(0),y1:Y(-M),x2:X(60),y2:Y(60*d-M),stroke:'var(--accent)','stroke-width':3},sv);
 el('line',{x1:X(n),y1:60,x2:X(n),y2:320,stroke:'var(--text)','stroke-dasharray':'5 4'},sv);el('circle',{cx:X(n),cy:Y(G),r:6,fill:G>=0?'var(--good)':'var(--bad)'},sv);
 [0,20,40,60].forEach(v=>T(String(v),X(v),Y(0)+16,'middle'))}
let k=0,custom=null;
function draw(){clear(sv);const v=custom||F[k];SET(IDS,v);render(...v)}
function reset(){k=0;custom=null;draw()}
function next(){if(custom!==null){custom=null;draw();return true}if(k>=F.length-1)return false;k++;draw();return true}
IDS.forEach(i=>{const e=$(i);const f=()=>{ANIM.stop();custom=GET(IDS);draw()};e.oninput=f;e.onchange=f});
setupPlayer({captureSeed:1,reset,next},1500);
</script><a href="https://wikieden.github.io/ai-books/" style="position:fixed;right:12px;bottom:12px;z-index:99;padding:4px 10px;border-radius:14px;background:rgba(127,127,127,.18);color:inherit;font:13px/1.6 system-ui,sans-serif;text-decoration:none">← 全部讲义书</a>
</body></html>
